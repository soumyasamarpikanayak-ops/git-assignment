<!DOCTYPE html>
<html>
<head>
    <title>Video Hero</title>
    <style>
        /* Remove default spacing */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    cursor: pointer;
}

body{
    font-family:Arial, sans-serif;
}

/* Hero Section */
.hero{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

/* Video Background */
.hero-video{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

/* Dark Overlay */
.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0, 0, 0, 0.4);
    z-index:2;
}

/* Text Content */
.hero-content{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    text-align:center;
    color:white;
    z-index:3;
}

.hero-content h1{
    font-size:4rem;
    margin-bottom:20px;
}

.hero-content p{
    font-size:1.3rem;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    padding:12px 30px;
    background:white;
    color:black;
    text-decoration:none;
    border-radius:5px;
    font-weight:bold;
}
    </style>
</head>
<body>

    <section class="hero">

        <!-- Background Video -->
        <video autoplay muted loop playsinline class="hero-video">
            <source src="https://sxcontent9668.azureedge.us/cms-assets/assets/20260522_Starship_Flight12_web1920_v2_71d68b5ee9.mp4" type="video/mp4">
        </video>

        <!-- Dark Overlay -->
        <div class="overlay"></div>

        <!-- Hero Content -->
        <div class="hero-content">
            <h1>Welcome to Our Website</h1>
            <p>Build amazing products with us</p>
            <a href="#" class="btn">Get Started</a>
        </div>

    </section>

</body>
</html>
