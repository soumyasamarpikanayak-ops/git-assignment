<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #home{
            height:100vh;
            width:100%;
            background:rgba(205, 220, 253, 0.979);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #home-in{
            height:700px;
            width:95%;
           
            background:rgba(196, 210, 241, 0.979);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
        #home-l{
            height:650px;
            width:700px;
            
            background:rgba(169, 188, 227, 0.979);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
       
        #l-up{
            height:300px;
            width:600px;
            
            background:rgba(169, 188, 227, 0.979);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border-radius: 10px;
        }
        #l-up h2{
            color: rgb(1, 1, 227);
            font-size: 80px;
            font-weight:bold;
        }
        #l-up h1{
            color: black;
            font-size: 80px;
            font-weight:bold;
        }

        #l-down{
            height:300px;
            width:600px;
            
            background:rgba(169, 188, 227, 0.979);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
        #l-down p{
            font-size: 20px;
            color: black;
            font-weight:cursive;
        }
        #btn-box{
            height:100px;
            width: 400px;
            display: flex;
            flex-direction: row;
            font-weight: bold;
           
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            gap:20px;
            
        
           
        }
        #btn-box button{
            height:50px;
            width: 80px;
            
            font-weight: bold;
            font-size: 12px;
           
            border-radius: 10px;
            color: aliceblue;
            background: rgb(9, 9, 146);
            
           
        }
        #home-r{
            height:650px;
            width:700px;
            
            background:rgba(169, 188, 227, 0.979);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            gap:20px;
        }
        #r-up{
            height:600px;
            width:400px;
            display: flex;
        }
        #r-up img{
            border-radius: 10px;
        }
        #r-down img{
            border-radius: 10px;
        }
    </style>
</head>
<body>
   <div id="home">
    <div id="home-in">
        <div id="home-l">
            <div id="l-up">
                <h1>For The</h1><br>
                <h2>Love</h2><br>
                <h2>Of Blooms.</h2>
            </div>
            <div id="l-down">
                <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Hic, debitis.</p><br>
                
                <div id="btn-box">
                    <button>Sign Up</button><br>
                    <button>Browse Now</button>
                </div>
            </div>
        </div>
