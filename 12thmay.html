<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        button{
            background-color: rgb(5, 75, 75);
            padding:10px 40px;
            margin:30px;
            border: 6px solid lightgreen;
            height:300px;
            width:300px;
            
            cursor:pointer;
            transition: 2s;
            transition-timing-function:ease-in-out;
            font-weight:bold;
            color: aliceblue;
            font-size:25px;

        }
        button:hover{
            background-color: bisque;
            padding:10px 40px;
            margin:30px;
            border:3px solid blue;
            border-radius:10px;
            color:black;
            font-weight: lighter;
        }
    </style>
</head>
<body>
     <button>I am Button Section😊</button>
</body>
</html>
