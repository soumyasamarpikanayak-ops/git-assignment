<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        #d1{
           width:50px; 
           height:50px; 
           margin-left:400px; 
           margin-top:50px; 
           border-radius: 50%;
           background-color: rgb(231, 182, 197);
            border:2px solid black;
            animation:move 1.2s infinite alternate;
            box-shadow:0px 8px 20px rgba(243, 12, 12, 0.859);
        }
        @keyframes move{
            from{
                transform:translateY(0);
            }
            to{
                transform:translateY(300px);
            }
        } 
    </style>
</head>
<body>
   <div id="d1">

   </div>
</body>
</html>
